[project]
name = "backend"
version = "0.1.0"
description = "AI Note Backend - FastAPI + LangChain + DeepSeek"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sse-starlette>=2.0.0",
    "ainote-harness",
]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
ainote-harness = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ainote*"]
exclude = ["appBackup*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]