[project]
name = "backend"
version = "0.1.0"
description = "AI Note Backend - FastAPI + LangChain + DeepSeek"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sse-starlette>=2.0.0",
    "langchain>=1.3.2",
    "langchain-deepseek>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "trustcall>=0.0.39",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "deepagents>=0.6.7",
    "tavily-python>=0.7.25",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[pool]>=3.2.0",
    "pyppeteer>=0.0.25",
    "ipython>=9.14.1",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.2.0",
    "groq>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["appBackup*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

